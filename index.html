<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Mabokoto Construction Company</title>
    <link rel="canonical" href="https://mabokoto-construction-6gm2.vercel.app/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light">
    <div class="scatter-field">
        <i class="fas fa-hammer"></i>
        <i class="fas fa-wrench"></i>
        <i class="fas fa-screwdriver"></i>
        <i class="fas fa-paint-roller"></i>
        <i class="fas fa-trowel"></i>
        <i class="fas fa-hard-hat"></i>
        <i class="fas fa-tools"></i>
        <i class="fas fa-ruler-combined"></i>
        <i class="fas fa-drafting-compass"></i>
        <i class="fas fa-cubes"></i>
    </div>

    <main class="gallery-wrapper">
        <div class="header">
            <div>
                <img src="logo-round.png" alt="Mabokoto Logo" style="display:block; width:150px; height:100px; z-index:10; border-radius:35px;">
            </div>
            <div class="theme-toggle">
                <button id="btn-light" class="active" title="light mode"><i class="fas fa-sun"></i></button>
                <button id="btn-dark" title="dark mode"><i class="fas fa-moon"></i></button>
            </div>
        </div>

        <section style="text-align: center; margin-bottom: 2rem;">
            <h1>Mabokoto Construction</h1>
            <p style="font-size: 1.2rem; color: var(--text-secondary);">Quality Building & Maintenance Services</p>
        </section>

        <div class="services-grid">
            <a href="building-and-plaster.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                </div>
                <span>Building</span>
            </a>
            <a href="plumbing-services.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"></path></svg>
                </div>
                <span>Plumbing</span>
            </a>
            <a href="tiling-services.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                </div>
                <span>Tiling</span>
            </a>
            <a href="ceilings.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <span>Ceilings</span>
            </a>
            <a href="interior-and-finishing.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l5 5"></path><path d="M9.5 14.5L16 8"></path></svg>
                </div>
                <span>Interior</span>
            </a>
            <a href="solar-geyser-energy-installation.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </div>
                <span>Solar</span>
            </a>
            <a href="maintenance-services.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                </div>
                <span>Maintenance</span>
            </a>
            <a href="about-us.html" class="service-card">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
                <span>About Us</span>
            </a>
        </div>

        <div style="margin-top: 3rem; text-align: center; color: var(--text-secondary);">
            <p>Mobile: +27 72 146 7896</p>
            <p>Email: <a href="mailto:info@mabokoto.co.za">info@mabokoto.co.za</a></p>
        </div>
    </main>

    <script src="script.js"></script>
    <style>
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }
        .service-card:hover {
            transform: translateY(-5px);
            background: var(--arrow-hover);
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: transparent;
        }
        .icon-wrapper {
            width: 48px;
            height: 48px;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-wrapper svg {
            width: 100%;
            height: 100%;
            transition: transform 0.3s;
        }
        .service-card:hover .icon-wrapper svg {
            transform: scale(1.1);
        }
        .service-card span {
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }
        @media (max-width: 480px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }
    </style>
</body>
</html>
