<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiling Services</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .touch-target {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .touch-target {
                padding: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tiling Services</h1>
        <p>We provide high-quality tiling services with a focus on customer satisfaction. Our team is skilled and experienced, ensuring a perfect finish every time.</p>
        <img src="path/to/your/image.jpg" alt="Tiling example">
        <button class="touch-target">Contact Us</button>
        <p>Get in touch today for a free quote!</p>
    </div>
</body>
</html>
